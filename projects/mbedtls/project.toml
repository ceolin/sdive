# Mbed TLS analysis scope and areas. Paths are repo-relative; `**` spans
# directories. Only .c/.h files are indexed. Areas match in order, first wins;
# priority 5 = most directly attacker-exposed.
#
# Mbed TLS 4.x holds the TLS/DTLS stack, X.509 and PKCS#7 (~53k lines in
# library/). Cryptography moved to TF-PSA-Crypto, a submodule here: it is a
# reference tree (API contracts, upstream notes), not audit scope.
# programs/ (sample and test programs) and tests/ are out of scope.

[runs]
sweep_order = ["memory-safety", "authentication", "protocol-state", "side-channel", "secrets"]

[scope]
include = [
    "library/**",
    "include/mbedtls/**",
]
exclude = [
    "library/ssl_tls13_invasive.h",   # test hooks (MBEDTLS_TEST_HOOKS)
]
default_area = { name = "misc", priority = 1, description = "In scope, not otherwise classified (version, config glue)." }

# The restricted branches can pin TF-PSA-Crypto commits holding embargoed
# fixes, which only TF-PSA-Crypto-restricted has; .gitmodules names the
# public repo, so fetch from the restricted one (a superset).
[[reference]]
path = "tf-psa-crypto"
url = "https://github.com/Mbed-TLS/TF-PSA-Crypto-restricted.git"
role = "TF-PSA-Crypto: PSA Crypto API, builtin drivers, PK/ASN.1/PEM/base64 (extras): the crypto Mbed TLS 4.x calls"
export = ["include", "core", "drivers", "dispatch", "extras", "platform", "utilities"]

# --- record layer -----------------------------------------------------------

[[areas]]
name = "tls-record"
priority = 5
description = "Record layer: reading, decrypting and authenticating records (CBC/MAC, AEAD, padding), DTLS replay window and handshake reassembly, message buffering, MPS reader."
globs = [
    "library/ssl_msg.c",
    "library/mps_reader.[ch]",
    "library/mps_common.h",
    "library/mps_error.h",
]

# --- handshake --------------------------------------------------------------

[[areas]]
name = "tls13-handshake"
priority = 5
description = "TLS 1.3 client and server handshake: hello and extension parsing, HRR, PSK and tickets, certificate and CertificateVerify, Finished, early data, post-handshake messages."
globs = [
    "library/ssl_tls13_client.c",
    "library/ssl_tls13_server.c",
    "library/ssl_tls13_generic.c",
]

[[areas]]
name = "tls12-handshake"
priority = 5
description = "TLS 1.2 / DTLS 1.2 client and server handshake: hellos and extensions, key exchanges (ECDHE, PSK, ECJPAKE), ServerKeyExchange signatures, renegotiation, HelloVerifyRequest."
globs = [
    "library/ssl_tls12_client.c",
    "library/ssl_tls12_server.c",
]

[[areas]]
name = "tls-core"
priority = 5
description = "Version-independent TLS: context and session handling, Certificate/Finished processing, peer certificate verification glue, ALPN/SNI/hostname, signature algorithms, key derivation for 1.2, ClientHello writing."
globs = [
    "library/ssl_tls.c",
    "library/ssl_client.[ch]",
    "library/ssl_misc.h",
    "include/mbedtls/ssl.h",
]

[[areas]]
name = "tls13-keys"
priority = 4
description = "TLS 1.3 key schedule: HKDF-Expand-Label, traffic and resumption secrets, binders, Finished MAC, key export."
globs = [
    "library/ssl_tls13_keys.[ch]",
]

[[areas]]
name = "tls-session-store"
priority = 4
description = "Session tickets (peer-presented, decrypted with the server's key), session cache, DTLS cookies."
globs = [
    "library/ssl_ticket.c",
    "library/ssl_cache.c",
    "library/ssl_cookie.c",
    "include/mbedtls/ssl_ticket.h",
    "include/mbedtls/ssl_cache.h",
    "include/mbedtls/ssl_cookie.h",
]

[[areas]]
name = "tls-ciphersuites"
priority = 3
description = "Ciphersuite table and selection helpers."
globs = [
    "library/ssl_ciphersuites.c",
    "library/ssl_ciphersuites_internal.h",
    "include/mbedtls/ssl_ciphersuites.h",
]

# --- X.509 and PKCS#7 ---------------------------------------------------------

[[areas]]
name = "x509-crt"
priority = 5
description = "Certificate parsing (DER/PEM, extensions, names, SAN) and chain verification: trust anchors, signatures, validity, key usage, name constraints, CRL checks, hostname matching."
globs = [
    "library/x509_crt.c",
    "include/mbedtls/x509_crt.h",
]

[[areas]]
name = "x509-common"
priority = 5
description = "Shared X.509 parsing: names, algorithm identifiers, times, extensions, serials, OIDs, string conversion of parsed fields."
globs = [
    "library/x509.c",
    "library/x509_oid.[ch]",
    "library/x509_internal.h",
    "include/mbedtls/x509.h",
    "include/mbedtls/oid.h",
]

[[areas]]
name = "x509-crl-csr"
priority = 4
description = "CRL and CSR parsing."
globs = [
    "library/x509_crl.c",
    "library/x509_csr.c",
    "include/mbedtls/x509_crl.h",
    "include/mbedtls/x509_csr.h",
]

[[areas]]
name = "pkcs7"
priority = 4
description = "PKCS#7 SignedData parsing and signature verification."
globs = [
    "library/pkcs7.c",
    "include/mbedtls/pkcs7.h",
]

[[areas]]
name = "x509-write"
priority = 2
description = "Writing certificates and CSRs, and parsing the application's name strings (x509_create): application-supplied input."
globs = [
    "library/x509write*.c",
    "library/x509_create.c",
]

# --- platform glue and diagnostics -------------------------------------------

[[areas]]
name = "net-timing"
priority = 2
description = "BSD sockets and timer glue used by the sample BIO callbacks."
globs = [
    "library/net_sockets.c",
    "library/timing.c",
    "include/mbedtls/net_sockets.h",
    "include/mbedtls/timing.h",
]

[[areas]]
name = "debug"
priority = 1
description = "Debug output (MBEDTLS_DEBUG_C) and MPS tracing."
globs = [
    "library/debug.c",
    "library/debug_internal.h",
    "library/ssl_debug_helpers.h",
    "library/mps_trace.[ch]",
    "include/mbedtls/debug.h",
]
