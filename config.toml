# security-dive configuration. Paths are absolute or relative to this file.

[paths]
analysis = "analysis"   # private: ledger, findings, dossiers (own nested repo)
work = "work"           # disposable: mirrors, snapshots

[projects.mcuboot]
github = "mcu-tools/mcuboot"
upstream = "https://github.com/mcu-tools/mcuboot.git"
# Local clone used only as `--reference` when creating the mirror; never written.
reference_repo = "/Users/davidb/linaro/mcuboot"
default_branch = "main"
threat_model = "projects/mcuboot/threat-model.md"  # derived from ../zepsec/threat-model.md, finding refs removed

[projects.zephyr]
github = "zephyrproject-rtos/zephyr"
upstream = "https://github.com/zephyrproject-rtos/zephyr.git"
reference_repo = "/Users/davidb/zephyrproject/zephyr"
default_branch = "main"
threat_model = "projects/zephyr/threat-model.md"  # draft; Open rulings pending the Zephyr security team

# Machine-specific: what `sdive build zephyr` configures with. The Python env
# and the module cache are the user's and are only read (PYTHONDONTWRITEBYTECODE,
# west --path-cache clones from them).
[projects.zephyr.build]
python_bin = "~/zephyrproject/.venv/bin"
sdk = "~/.local/opt/zephyr-sdk-1.0.0"
module_cache = "~/zephyrproject"
default_board = "qemu_cortex_m3"
